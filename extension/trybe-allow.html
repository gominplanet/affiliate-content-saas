<html lang="en"><head><meta charset="utf-8"><title>SCOUT: allow TRYBE</title>

<h1>Let SCOUT work in TRYBE?</h1>
<p>SCOUT will read the brands in TRYBE's Discover Brands and, only for the requests you approve in MVP, press Request to Join and send your message.</p>
<p>Chrome asks once. You can take it back any time in SCOUT's extension settings.</p>
<button id="allow" type="button">Allow on TRYBE</button>
<button id="no" class="no" type="button">Not now</button>
<p id="said" role="status"></p>
