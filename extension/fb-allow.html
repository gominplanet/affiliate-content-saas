<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SCOUT: allow Facebook</title>
<style>
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:24px;color:#11151D;background:#fff}
h1{font-size:18px;margin:0 0 8px}
p{margin:0 0 14px;color:#566070}
button{font:700 15px system-ui,sans-serif;background:#1877F2;color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
button.no{background:none;color:#566070;font-weight:500;padding:11px 8px}
#said{margin-top:12px;font-size:14px}
</style></head><body>
<h1>Let SCOUT fill your Facebook Group posts?</h1>
<p>SCOUT will open your Group and type the post MVP wrote into the "Write something" box. It never presses Post: you check it and post it yourself.</p>
<p>Chrome asks once. You can take it back any time in SCOUT's extension settings.</p>
<button id="allow" type="button">Allow on Facebook</button>
<button id="no" class="no" type="button">Not now</button>
<p id="said" role="status"></p>
<script src="fb-allow.js"></script>
</body></html>
